<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#09090b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="logoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="6" result="offsetBlur"/>
      <feFlood flood-color="#6366f1" flood-opacity="0.55"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b"/>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Subtle grid lines -->
  <g stroke="#27272a" stroke-width="1" opacity="0.4">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="430" x2="1200" y2="430"/>
  </g>

  <!-- Early access pill -->
  <g transform="translate(600, 110)">
    <rect x="-110" y="-18" width="220" height="36" rx="18"
          fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="-86" cy="0" r="4" fill="#818cf8"/>
    <text x="0" y="5" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.5">
      Now in Early Access
    </text>
  </g>

  <!-- Logo block -->
  <g transform="translate(600, 250)" filter="url(#logoShadow)">
    <rect x="-58" y="-58" width="116" height="116" rx="26" fill="url(#logoGrad)"/>
    <text x="0" y="22" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="78" font-weight="800" text-anchor="middle">P</text>
  </g>

  <!-- Wordmark -->
  <text x="600" y="395" fill="#fafafa"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="72" font-weight="800" text-anchor="middle" letter-spacing="-2">
    Plexory
  </text>

  <!-- Tagline -->
  <text x="600" y="450" fill="#a1a1aa"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="28" font-weight="500" text-anchor="middle">
    The Missing Marketplace Browser for Claude Code
  </text>

  <!-- Feature row -->
  <g transform="translate(600, 520)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="20" font-weight="600" fill="#71717a" text-anchor="middle">
    <text x="0" y="0">
      <tspan fill="#a5b4fc">MCP servers</tspan>
      <tspan dx="14" fill="#52525b">·</tspan>
      <tspan dx="14" fill="#a5b4fc">Skills</tspan>
      <tspan dx="14" fill="#52525b">·</tspan>
      <tspan dx="14" fill="#a5b4fc">Commands</tspan>
      <tspan dx="14" fill="#52525b">·</tspan>
      <tspan dx="14" fill="#a5b4fc">Hooks</tspan>
    </text>
  </g>

  <!-- URL bottom right -->
  <text x="1140" y="600" fill="#6366f1"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace"
        font-size="18" font-weight="600" text-anchor="end" opacity="0.85">
    plexory.dev
  </text>
</svg>
